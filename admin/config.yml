# Decap CMS - konfigurace
# Produkce: git-gateway (potřebuje web v GitHub repu + Netlify Identity/OAuth).
# Lokální zkouška: `local_backend: true` + `npx decap-server`.

backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'CMS: přidána položka do {{collection}}'
    update: 'CMS: úprava {{collection}}'
    delete: 'CMS: smazána položka z {{collection}}'

# Lokální backend - editace bez GitHubu/loginu (jen na localhost, přes `npx decap-server`)
local_backend: true

locale: 'cs'
media_folder: 'images/menu'
public_folder: '/images/menu'

# Sdílená definice jedné položky menu (dvojjazyčně)
_item_fields: &item_fields
  - { label: 'Název (CZ)', name: cs_name, widget: string }
  - { label: 'Name (EN)', name: en_name, widget: string }
  - { label: 'Popis / ingredience (CZ)', name: cs_desc, widget: string, required: false }
  - { label: 'Description / ingredients (EN)', name: en_desc, widget: string, required: false }
  - { label: 'Cena (jen číslo, např. 225 nebo 1 050; degustace nechte prázdné)', name: price, widget: string, required: false }

collections:
  - name: menu
    label: 'Menu'
    files:
      - name: food
        label: 'Jídlo - menu'
        file: 'content/menu-food.json'
        format: json
        description: 'Ceny píšete jen číslem → zobrazí se jako „225 CZK“ (EN) a „225 Kč“ (CZ). Degustační menu ceny nemá - pole nechte prázdné.'
        fields:
          - { label: 'Ústřice (à la carte)', name: oysters, widget: list, label_singular: 'ústřice', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Malá jídla', name: small, widget: list, label_singular: 'malé jídlo', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Velká jídla', name: main, widget: list, label_singular: 'velké jídlo', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Dezerty', name: desserts, widget: list, label_singular: 'dezert', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Degustační menu', name: tasting, widget: list, label_singular: 'chod', summary: '{{fields.cs_name}}', fields: *item_fields }
          - { label: 'Bar - ústřice', name: bar_oysters, widget: list, label_singular: 'ústřice', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Bar - jídla', name: bar_dishes, widget: list, label_singular: 'jídlo', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }

      - name: drink
        label: 'Nápoje - menu'
        file: 'content/menu-drink.json'
        format: json
        description: 'Víno a champagne po sklenkách, koktejly, destiláty a nealko. Cena jen číslem. U destilátů patří procenta do popisu, ne do názvu.'
        fields:
          - { label: 'Víno - bílé po sklenkách', name: wine_white, widget: list, label_singular: 'víno', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Víno - červené & rosé po sklenkách', name: wine_red, widget: list, label_singular: 'víno', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Champagne po sklenkách', name: champagne, widget: list, label_singular: 'champagne', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - label: 'Klasické koktejly'
            name: classics
            widget: list
            label_singular: 'koktejl'
            summary: '{{fields.name}} - {{fields.price}}'
            fields:
              - { label: 'Název (stejný pro EN i CZ)', name: name, widget: string }
              - { label: 'Styl (CZ) - u klasik se nechává prázdné', name: style_cs, widget: string, required: false }
              - { label: 'Style (EN) - u klasik se nechává prázdné', name: style_en, widget: string, required: false }
              - { label: 'Ingredience (CZ, oddělovač •)', name: ing_cs, widget: string }
              - { label: 'Ingredients (EN, separator •)', name: ing_en, widget: string }
              - { label: 'Cena (jen číslo)', name: price, widget: string, required: false }

          - label: 'Signature koktejly'
            name: cocktails
            widget: list
            label_singular: 'koktejl'
            summary: '{{fields.name}} - {{fields.price}}'
            fields:
              - { label: 'Název (stejný pro EN i CZ, např. „Umi 海")', name: name, widget: string }
              - { label: 'Styl (CZ, např. „Osvěžující · lehký · návykový")', name: style_cs, widget: string, required: false }
              - { label: 'Style (EN)', name: style_en, widget: string, required: false }
              - { label: 'Ingredience (CZ, oddělovač •)', name: ing_cs, widget: string }
              - { label: 'Ingredients (EN, separator •)', name: ing_en, widget: string }
              - { label: 'Cena (jen číslo)', name: price, widget: string, required: false }

          - { label: 'Destiláty - vodka', name: spirits_vodka, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - gin', name: spirits_gin, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - rum', name: spirits_rum, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - tequila & mezcal', name: spirits_tequila, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - whisky', name: spirits_whisky, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - koniak', name: spirits_cognac, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - Montilla-Moriles', name: spirits_montilla, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - ratafia', name: spirits_ratafia, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Destiláty - ovocné pálenky', name: spirits_fruit, widget: list, label_singular: 'destilát', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Nealko', name: soft_drinks, widget: list, label_singular: 'nápoj', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Pivo', name: beer, widget: list, label_singular: 'pivo', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Káva', name: coffee, widget: list, label_singular: 'káva', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
          - { label: 'Čaj', name: tea, widget: list, label_singular: 'čaj', summary: '{{fields.cs_name}} - {{fields.price}}', fields: *item_fields }
